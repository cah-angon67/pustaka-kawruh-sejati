<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>HAKIKAT KAWRUH SEJATI | Pustaka Kawruh Sejati</title>

<link rel="stylesheet" href="style.css">

<style>
.book-intro {
  display: grid;
  grid-template-columns: 260px 1fr;
  gap: 35px;
  align-items: start;
  margin-bottom: 40px;
}

.book-intro .book-cover img {
  width: 100%;
  height: auto;
  display: block;
  border-radius: 5px;
}

.book-info {
  padding: 15px 0;
}

.book-info h1 {
  margin-top: 0;
}

.book-reading {
  width: 100%;
  margin-top: 30px;
}

.book-reading iframe {
  width: 100%;
  height: 700px;
  border: none;
}

.book-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 15px;
  margin-top: 20px;
}

@media (max-width: 600px) {
  .book-intro {
    grid-template-columns: 1fr;
    gap: 20px;
  }

  .book-intro .book-cover {
    max-width: 240px;
    margin: auto;
  }

  .book-info {
    text-align: center;
  }

  .book-actions {
    justify-content: center;
  }

  .book-reading iframe {
    height: 550px;
  }
}
</style>

</head>

<body>

<header class="site-header">
  <a class="brand" href="index.html">
    <span class="brand-mark">ꦏ</span>
    <span>
      <b>PUSTAKA</b>
      <small>KAWRUH SEJATI</small>
    </span>
  </a>

  <button class="menu-toggle"
          aria-label="Buka navigasi"
          aria-expanded="false">☰</button>

  <nav class="nav">
    <a href="index.html">Beranda</a>
    <a href="artikel.html">Artikel</a>
    <a href="katalog.html">Katalog Buku</a>
  </nav>
</header>

<main>

<section class="book-detail">

<div class="book-intro">

  <div class="book-cover">
    <img
      src="kawruh-sejati.jpg"
      alt="Cover buku Hakikat Kawruh Sejati">
  </div>

  <div class="book-info">
    <h1>HAKIKAT KAWRUH SEJATI</h1>

    <div class="book-actions">
      <a class="btn gold" href="#baca-buku">
        Baca Buku ↓
      </a>
    </div>
  </div>

</div>

<div class="book-reading" id="baca-buku">

<h2>Baca Buku</h2>

<iframe
  src="https://drive.google.com/file/d/1vo11_gr-BMDtdspAJ5aqM9aKvgSOMOAy/preview"
  allow="autoplay">
</iframe>

<div class="book-actions">

  <a
    class="btn gold"
    href="https://drive.google.com/file/d/1vo11_gr-BMDtdspAJ5aqM9aKvgSOMOAy/view"
    target="_blank"
    rel="noopener">
    Buka PDF di Google Drive ↗
  </a>

  <a class="btn gold" href="katalog.html">
    Kembali ke Katalog Buku
  </a>

</div>

</div>

</section>

</main>

<script src="back-to-top.js"></script>
</body>
</html>
